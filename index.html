<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nicole · Question Words</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#24243b;background:#f7f6fd}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:26px 18px 65px}
.hero{background:linear-gradient(125deg,#5448c8,#ae58c5);color:white;border-radius:24px;padding:30px}
h1{margin:8px 0;font-size:clamp(26px,4vw,40px)}h2{margin:0 0 5px;font-size:24px}p{line-height:1.55}
.small{font-size:14px;opacity:.82}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.tab{border:1px solid #dedaf2;background:white;border-radius:999px;padding:10px 14px;cursor:pointer;font-weight:650;color:#554b90}
.tab.active{background:#5146c5;color:white}.panel{display:none}.panel.active{display:block}
.card{background:white;border:1px solid #e5e2f2;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 12px #39315a09}
.prompt{font-size:18px;font-weight:650;margin:0 0 14px;line-height:1.5}
.choices{display:flex;gap:9px;flex-wrap:wrap}.choice{border:1.5px solid #d9d5ee;background:#fff;border-radius:11px;padding:10px 13px;font:inherit;cursor:pointer;text-align:left}
.choice:hover{border-color:#8175d7}.choice.selected{background:#efebff;border-color:#5146c5}.choice.correct{background:#e7f8ed;border-color:#24935c}.choice.wrong{background:#ffeded;border-color:#d9515e}
.feedback{margin-top:13px;padding:12px 14px;border-radius:11px;line-height:1.5;font-size:15px}
.feedback.good{background:#e9f8ef;color:#165e3a}.feedback.bad{background:#fff0f0;color:#8e3039}
.answer{font:inherit;font-size:17px;padding:11px 12px;border:1.5px solid #cbc7e3;border-radius:10px;max-width:300px;width:100%}
.check,.reset,.next{font:inherit;font-weight:700;background:#5146c5;color:white;border:0;border-radius:10px;padding:11px 17px;cursor:pointer}
.check{margin-left:8px}.reset{background:#eae7f8;color:#5146c5}.next{margin-top:18px}
.progress{height:9px;background:#e8e5f3;border-radius:30px;overflow:hidden;margin-top:12px}.bar{height:100%;background:#56b68a;width:0%;transition:width .25s}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#66617e;font-size:14px}
.footer{margin-top:22px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:600px){.hero{padding:23px}.card{padding:16px}.check{margin:9px 0 0}.answer{max-width:100%}}
</style></head><body><main class="wrap">
<header class="hero"><div class="small">NICOLE · A1 / A1+</div><h1>Question Words 💬</h1>
<p>Повторяем вопросительные слова: от простого выбора до вопросов, которые помогают поддерживать разговор.</p>
<div class="small">Только вопросы с do / does в Present Simple · Инструкции и объяснения на русском</div></header>
<nav class="tabs" id="tabs"></nav><div class="meta"><span id="sectionMeta"></span><span id="score"></span></div>
<div class="progress"><div class="bar" id="bar"></div></div><section id="content"></section>
<div class="footer"><button class="reset" id="reset">↻ Начать этот блок заново</button><button class="next" id="next">Следующий блок →</button></div>
</main><script>
const tasks=[{"title": "1. Вспоминаем значения", "level": "Remember", "instruction": "Выбери вопросительное слово, которое подходит к ответу.", "items": [["Twice a week.", "How often", ["How often", "When", "What time"], "«Twice a week» обозначает частоту — два раза в неделю. How often спрашивает «как часто?»."], ["At 9 o'clock.", "What time", ["When", "What time", "How often"], "«At 9 o'clock» — точное время на часах. Нужен What time, а не How often (частота)."], ["Because I love it.", "Why", ["How", "Why", "What"], "Because вводит причину. Why спрашивает «почему?», а How — «как?»."], ["My brother's.", "Whose", ["Who", "Whose", "Which"], "Здесь говорится, кому принадлежит вещь: «моего брата». Whose = «чей?», Who = «кто?»."], ["Five.", "How many", ["How much", "How many", "How often"], "Five — количество исчисляемых предметов. How many = «сколько?» для исчисляемых существительных."], ["About $30.", "How much", ["How many", "How much", "What time"], "Речь о цене. How much спрашивает «сколько стоит?»."], ["The red one.", "Which", ["What", "Which", "Whose"], "Выбираем один вариант из нескольких. Which = «который из?»."], ["By bus.", "How", ["Where", "How", "When"], "By bus — способ передвижения. How = «как? каким способом?»."], ["In Turkey.", "Where", ["Where", "When", "Why"], "Это место. Where = «где? куда?»."], ["My best friend.", "Who", ["Whose", "Who", "What"], "Это человек. Who = «кто?», Whose = «чей?»."], ["Pizza.", "What", ["Which", "What", "How much"], "Называем предмет/еду без выбора из известных вариантов. What = «что?»."], ["On Saturdays.", "When", ["What time", "When", "How many"], "On Saturdays указывает на дни, когда что-то происходит. When = «когда?»."]]}, {"title": "2. Выбираем по смыслу", "level": "Understand", "instruction": "Прочитай вопрос и выбери подходящее вопросительное слово. Обращай внимание на подсказки в конце вопроса.", "items": [["___ do you watch romantic comedies? — Every weekend.", "How often", ["How often", "How many", "What time"], "Every weekend — частота, поэтому How often. How many спрашивает количество, What time — точное время."], ["___ do you go to work? — By car.", "How", ["Where", "How", "Who"], "By car отвечает на вопрос о способе. How do you go to work?"], ["___ do you usually watch TV with? — My boyfriend.", "Who", ["Who", "Whose", "Which"], "Спрашиваем о человеке: Who ... with? Whose спрашивает о принадлежности."], ["___ do you like this series? — Because it's funny.", "Why", ["What", "Why", "When"], "Because объясняет причину. Нужен Why."], ["___ do you prefer, tea or coffee? — Coffee.", "Which", ["What", "Which", "Whose"], "Даны два варианта выбора. Which точнее передаёт «который из?»."], ["___ do you spend on coffee every week? — About $10.", "How much", ["How many", "How often", "How much"], "Спрашиваем сумму денег, а не количество чашек. How much."], ["___ phone do you use? — My sister's.", "Whose", ["Who", "Whose", "Which"], "My sister's означает принадлежность: Whose phone?"], ["___ do you usually get up? — At 8.", "What time", ["When", "How often", "What time"], "At 8 — точное время, поэтому What time."], ["___ books do you read a month? — Two.", "How many", ["How much", "How many", "Which"], "Books — исчисляемое существительное, нужен How many."], ["___ do you usually meet your friends? — At a café.", "Where", ["Where", "When", "How"], "At a café обозначает место встречи. Where."]]}, {"title": "3. Находим подходящий вопрос", "level": "Understand · deeper", "instruction": "Прочитай ответ и выбери вопрос, на который человек действительно отвечает.", "items": [["I meet my friends twice a week.", "How often do you meet your friends?", ["When do you meet your friends?", "How often do you meet your friends?", "Where do you meet your friends?"], "Twice a week сообщает частоту. When обычно спрашивает о дне или времени, Where — о месте."], ["I watch series with my sister.", "Who do you watch series with?", ["Whose series do you watch?", "Who do you watch series with?", "How often do you watch series?"], "With my sister отвечает на вопрос «с кем?». Who ... with? — правильный вариант."], ["I prefer the blue dress.", "Which dress do you prefer?", ["Whose dress do you prefer?", "How many dresses do you prefer?", "Which dress do you prefer?"], "The blue dress — выбор конкретного варианта. Which dress?"], ["I go to work at 12.", "What time do you go to work?", ["How often do you go to work?", "What time do you go to work?", "Why do you go to work?"], "At 12 — время на часах. What time?"], ["I spend about 2,000 roubles on food.", "How much do you spend on food?", ["How many do you spend on food?", "How much do you spend on food?", "What do you spend on food?"], "Сумма денег требует How much. How many употребляется с исчисляемыми предметами."], ["I like this film because the story feels real.", "Why do you like this film?", ["How do you like this film?", "Why do you like this film?", "Which film do you like?"], "Because вводит объяснение причины. Why?"], ["I usually go shopping on Sundays.", "When do you usually go shopping?", ["What time do you usually go shopping?", "When do you usually go shopping?", "How much do you usually go shopping?"], "On Sundays обозначает день, а не точное время. When?"], ["I usually buy three books a month.", "How many books do you usually buy a month?", ["How much books do you usually buy a month?", "How many books do you usually buy a month?", "Whose books do you usually buy a month?"], "Books можно посчитать, поэтому How many books?"]]}, {"title": "4. Вставляем слово сами", "level": "Apply", "instruction": "Впиши вопросительное слово или выражение на английском. Можно писать с маленькой буквы.", "items": [["___ do you usually have breakfast? — At 10.", "What time", [], "At 10 — точное время. Правильный вариант: What time."], ["___ do you visit other countries? — Once a year.", "How often", [], "Once a year — частота. Правильный вариант: How often."], ["___ do you go on holiday with? — My friends.", "Who", [], "My friends — люди. Вопрос «с кем?» начинается с Who."], ["___ do you like romantic films? — Because they make me happy.", "Why", [], "Because указывает на причину. Нужно Why."], ["___ languages do you study? — English and French.", "What", [], "Здесь спрашиваем, какие языки человек изучает вообще. What languages?"], ["___ bag do you use, the black one or the brown one? — The black one.", "Which", [], "Есть выбор между двумя сумками: Which bag?"], ["___ water do you drink every day? — About two litres.", "How much", [], "Water — неисчисляемое существительное, поэтому How much."], ["___ games do you play? — Three.", "How many", [], "Games — исчисляемое существительное во множественном числе. How many."], ["___ do you usually spend your weekends? — At home.", "Where", [], "At home — место. Where."], ["___ laptop do you use? — My boyfriend's.", "Whose", [], "My boyfriend's — принадлежность. Whose laptop?"], ["___ do you get to work? — By bus.", "How", [], "By bus — способ передвижения. How."], ["___ do you usually see your friends? — On Fridays.", "When", [], "On Fridays — день, когда происходит действие. When."]]}, {"title": "5. Помогаем разговору", "level": "Analyse · Evaluate", "instruction": "Прочитай реплику и выбери самый уместный следующий вопрос. Некоторые варианты повторяют уже известную информацию.", "items": [["A: I watch How I Met Your Mother every evening.", "Why do you like it?", ["How often do you watch it?", "Why do you like it?", "What time do you watch every evening?"], "Частота уже известна: every evening. Лучше узнать причину, почему человеку нравится сериал."], ["A: I go to Turkey with my friends every summer.", "What do you usually do there?", ["Who do you go with?", "How often do you go there?", "What do you usually do there?"], "Мы уже знаем, с кем (friends) и как часто (every summer). Вопрос What do you do there? добавляет новую информацию."], ["A: I buy two books every month.", "What books do you usually buy?", ["How many books do you buy?", "What books do you usually buy?", "How often do you buy two books?"], "Количество и частота уже известны. Спросить о книгах — логичное продолжение."], ["A: I play video games with my boyfriend.", "What games do you play?", ["Who do you play with?", "Whose boyfriend do you play with?", "What games do you play?"], "Собеседник уже сказал with my boyfriend. Лучше узнать, во что они играют."], ["A: I usually have breakfast at 9.", "What do you usually eat?", ["What time do you have breakfast?", "How often do you have breakfast at 9?", "What do you usually eat?"], "Время уже известно. Вопрос о еде развивает разговор."], ["A: I love this café because it has great coffee.", "How often do you go there?", ["Why do you love this café?", "How often do you go there?", "Whose coffee do you love?"], "Причина уже названа. Уместно узнать, как часто человек посещает кафе."]]}];
let current=0,answers={};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.toLowerCase().replace(/[?.!]/g,'').replace(/\s+/g,' ').trim();
function render(){
 const t=tasks[current], saved=answers[current]||{};
 document.getElementById('tabs').innerHTML=tasks.map((x,i)=>`<button class="tab ${i===current?'active':''}" data-tab="${i}">${esc(x.level.split(' ·')[0])} ${i+1}</button>`).join('');
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=+b.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'})});
 document.getElementById('sectionMeta').textContent=t.title+' · '+t.items.length+' вопросов';
 document.getElementById('content').innerHTML=`<div class="card"><h2>${esc(t.title)}</h2><p>${esc(t.instruction)}</p></div>`+
 t.items.map((it,i)=>{
 let a=saved[i],isInput=!it[2].length,correct=a!==undefined&&norm(a)===norm(it[1]);
 return `<article class="card"><div class="small">Задание ${i+1} из ${t.items.length}</div><div class="prompt">${esc(it[0])}</div>`+
 (isInput?`<input class="answer" id="input-${i}" aria-label="Впиши вопросительное слово" placeholder="Твой ответ..." value="${esc(a||'')}"><button class="check" data-check="${i}">Проверить</button>`:
 `<div class="choices">${it[2].map(opt=>`<button class="choice ${a===opt?'selected '+(correct?'correct':'wrong'):''}" data-choice="${i}" data-value="${esc(opt)}">${esc(opt)}</button>`).join('')}</div>`)+
 (a!==undefined?`<div class="feedback ${correct?'good':'bad'}"><strong>${correct?'✓ Верно!':'✕ Пока не подходит.'}</strong> ${correct?'Правильный ответ: '+esc(it[1])+'. ': 'Правильный ответ: '+esc(it[1])+'. '}${esc(it[3])}</div>`:'')+'</article>';
 }).join('');
 document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{(answers[current]??={})[+b.dataset.choice]=b.dataset.value;render()});
 document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{const i=+b.dataset.check;(answers[current]??={})[i]=document.getElementById('input-'+i).value;render();});
 document.querySelectorAll('.answer').forEach(el=>el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.querySelector(`[data-check="${el.id.split('-')[1]}"]`).click()}});
 const total=t.items.length,done=Object.keys(saved).length,good=t.items.filter((it,i)=>saved[i]!==undefined&&norm(saved[i])===norm(it[1])).length;
 document.getElementById('score').textContent=`Проверено: ${done}/${total} · Верно: ${good}`;
 document.getElementById('bar').style.width=(done/total*100)+'%';
 document.getElementById('next').style.display=current===tasks.length-1?'none':'';
}
document.getElementById('reset').onclick=()=>{delete answers[current];render()};
document.getElementById('next').onclick=()=>{if(current<tasks.length-1){current++;render();window.scrollTo({top:0,behavior:'smooth'})}};
render();
</script></body></html>
